<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY TETRIS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;600;800&display=swap');

:root {
  --bg: #0b1020;
  --panel: #151d33;
  --text: #f3f6ff;
  --muted: #8c9ab8;
  --accent: #65fbd2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, #202e50 0%, #0b1020 65%);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 12px;
}

.app {
  width: 100%;
  max-width: 780px;
}

header {
  text-align: center;
  margin-bottom: 24px;
}

.logo {
  font: 900 clamp(32px, 7vw, 52px) 'Orbitron', sans-serif;
  letter-spacing: 5px;
  color: var(--accent);
  text-shadow: 0 0 25px #65fbd255;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 3px;
  margin-top: 8px;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 190px;
  gap: 16px;
  align-items: start;
}

.game-panel, .card {
  background: #151d33eF;
  border: 1px solid #ffffff16;
  border-radius: 18px;
  padding: 14px;
  box-shadow: 0 15px 45px #0003;
}

.game-panel {
  min-width: 0;
  position: relative;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 9px;
}

/* 01.png 이미지를 보드판 배경으로 적용하고 어두운 오버레이를 얹어 블록 가독성을 높였습니다 */
#board {
  background: rgba(8, 13, 27, 0.78) url('01.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border: 1px solid #263553;
}

.overlay {
  position: absolute;
  inset: 14px;
  background: rgba(8, 13, 27, 0.95);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
  z-index: 10;
}

.overlay.hidden { display: none !important; }

.overlay h2 {
  font: 700 26px 'Orbitron', sans-serif;
  margin: 0 0 12px;
  color: var(--accent);
}

.overlay p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

button {
  font: 600 14px 'Noto Sans KR', sans-serif;
  border: 1px solid #ffffff20;
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  background: #273451;
  cursor: pointer;
  transition: .15s;
}

button:hover {
  filter: brightness(1.2);
  transform: translateY(-1px);
}

button:active { transform: scale(.97); }

.primary {
  background: var(--accent);
  color: #08131d;
  border: none;
  font-weight: 800;
  width: 100%;
  margin-top: 10px;
}

.side {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.card-title {
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.stat {
  font: 700 24px 'Orbitron', sans-serif;
  color: var(--accent);
  overflow-wrap: anywhere;
}

.stat-label {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}

.stat-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.preview {
  width: 100%;
  max-width: 150px;
  margin: auto;
  background: #080d1b;
}

.mini-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.mini-stats .stat { font-size: 17px; }

.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.controls {
  font-size: 12px;
  line-height: 2;
  color: var(--muted);
}

kbd {
  display: inline-block;
  min-width: 24px;
  padding: 1px 5px;
  border-radius: 5px;
  background: #263451;
  color: #fff;
  text-align: center;
  font: 11px 'Noto Sans KR', sans-serif;
}

.mobile-controls {
  display: none;
  margin-top: 12px;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.mobile-controls button {
  font-size: 19px;
  min-height: 48px;
}

.mobile-controls .wide { grid-column: span 3; }

footer {
  color: #697793;
  text-align: center;
  font-size: 11px;
  margin-top: 18px;
}

@media (max-width: 540px) {
  body { padding: 16px 10px; }
  header { margin-bottom: 16px; }
  .layout { grid-template-columns: minmax(0, 1fr) 105px; gap: 8px; }
  .game-panel, .card { padding: 8px; border-radius: 12px; }
  .side { gap: 8px; }
  .stat { font-size: 17px; }
  .card-title { font-size: 9px; letter-spacing: 1px; }
  .stat-label { font-size: 10px; }
  .mini-stats { grid-template-columns: 1fr; }
  .actions button { padding: 10px 4px; font-size: 11px; }
  .controls { font-size: 10px; line-height: 2.2; }
  .mobile-controls { display: grid; }
  .subtitle { font-size: 10px; }
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="logo">TETRIS</div>
    <div class="subtitle">YOUR GAME · YOUR RULES</div>
  </header>

  <main class="layout">
    <section class="game-panel">
      <canvas id="board" width="300" height="600"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">READY?</h2>
        <p id="overlayText">블록을 쌓고 줄을 완성하세요.<br>최고 점수에 도전해 보세요!</p>
        <button class="primary" id="startBtn">게임 시작</button>
      </div>

      <div class="mobile-controls">
        <button data-action="left" aria-label="왼쪽">←</button>
        <button data-action="rotate" aria-label="회전">↻</button>
        <button data-action="right" aria-label="오른쪽">→</button>
        <button class="wide" data-action="down">▼ 빠르게 내리기</button>
        <button class="wide" data-action="drop">⤓ 즉시 떨어뜨리기</button>
      </div>
    </section>

    <aside class="side">
      <section class="card">
        <div class="card-title">NEXT BLOCK</div>
        <canvas id="next" class="preview" width="120" height="100"></canvas>
      </section>

      <section class="card">
        <div class="card-title">SCORE</div>
        <div class="stat" id="score">0</div>
        <div class="mini-stats">
          <div>
            <div class="card-title">LEVEL</div>
            <div class="stat" id="level">1</div>
          </div>
          <div>
            <div class="card-title">LINES</div>
            <div class="stat" id="lines">0</div>
          </div>
        </div>
      </section>

      <section class="card actions">
        <button class="primary" id="pauseBtn">Ⅱ 일시 정지</button>
        <button id="restartBtn">↻ 다시 시작</button>
      </section>

      <section class="card controls">
        <div class="card-title">KEYBOARD</div>
        <div><kbd>←</kbd> <kbd>→</kbd> 이동</div>
        <div><kbd>↑</kbd> 회전</div>
        <div><kbd>↓</kbd> 빠른 낙하</div>
        <div><kbd>Space</kbd> 즉시 낙하</div>
        <div><kbd>P</kbd> 일시 정지</div>
      </section>
    </aside>
  </main>

  <footer>MY TETRIS · BUILT FOR FUN</footer>
</div>

<!-- 배경음악 오디오 엘리먼트 추가 -->
<audio id="bgm" src="03.mp3" loop></audio>

<script>
(() => {
  "use strict";

  const COLS = 10;
  const ROWS = 20;
  const SIZE = 30;

  const COLORS = {
    I: "#65fbd2",
    O: "#ffe16b",
    T: "#bd8aff",
    S: "#70ef91",
    Z: "#ff7189",
    J: "#70a5ff",
    L: "#ffad68"
  };

  const SHAPES = {
    I: [[1,1,1,1]],
    O: [[1,1],[1,1]],
    T: [[0,1,0],[1,1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]],
    J: [[1,0,0],[1,1,1]],
    L: [[0,0,1],[1,1,1]]
  };

  const boardCanvas = document.getElementById("board");
  const ctx = boardCanvas.getContext("2d");
  const nextCanvas = document.getElementById("next");
  const nctx = nextCanvas.getContext("2d");
  const bgm = document.getElementById("bgm"); // 배경음악 엘리먼트

  const $ = id => document.getElementById(id);

  let board, current, nextType;
  let score = 0, lines = 0, level = 1;
  let running = false, paused = false, gameOver = false;
  let lastTime = 0, dropCounter = 0;
  let best = 0;

  try {
    best = Number(localStorage.getItem("myTetrisBest")) || 0;
  } catch (_) {}

  function randomType() {
    const keys = Object.keys(SHAPES);
    return keys[Math.floor(Math.random() * keys.length)];
  }

  function createPiece(type) {
    const shape = SHAPES[type].map(row => row.slice());
    return {
      type,
      shape,
      x: Math.floor((COLS - shape[0].length) / 2),
      y: 0
    };
  }

  function resetGame() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    score = 0;
    lines = 0;
    level = 1;
    dropCounter = 0;
    lastTime = performance.now();
    current = createPiece(randomType());
    nextType = randomType();
    running = true;
    paused = false;
    gameOver = false;
    $("overlay").classList.add("hidden");
    $("pauseBtn").textContent = "Ⅱ 일시 정지";
    updateStats();
    drawNext();
    draw();

    // 게임 시작 시 배경음악 재생
    bgm.play().catch(() => {});
  }

  function updateStats() {
    $("score").textContent = score.toLocaleString("ko-KR");
    $("level").textContent = level;
    $("lines").textContent = lines;
  }

  function drawCell(context, x, y, size, color) {
    context.fillStyle = color;
    context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);

    context.fillStyle = "#ffffff24";
    context.fillRect(x * size + 3, y * size + 3, size - 6, 3);

    context.strokeStyle = "#ffffff20";
    context.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
  }

  function drawGrid() {
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

    ctx.strokeStyle = "#ffffff0c";
    ctx.lineWidth = 1;

    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * SIZE + 0.5, 0);
      ctx.lineTo(x * SIZE + 0.5, ROWS * SIZE);
      ctx.stroke();
    }

    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * SIZE + 0.5);
      ctx.lineTo(COLS * SIZE, y * SIZE + 0.5);
      ctx.stroke();
    }
  }

  function draw() {
    if (!board) return;

    drawGrid();

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (board[y][x]) {
          drawCell(ctx, x, y, SIZE, board[y][x]);
        }
      }
    }

    if (current) {
      const ghost = { ...current, y: current.y };

      while (!collides(ghost, 0, 1)) ghost.y++;

      current.shape.forEach((row, dy) => {
        row.forEach((value, dx) => {
          if (value && ghost.y + dy >= 0) {
            ctx.fillStyle = COLORS[current.type] + "30";
            ctx.fillRect(
              (ghost.x + dx) * SIZE + 3,
              (ghost.y + dy) * SIZE + 3,
              SIZE - 6,
              SIZE - 6
            );
          }
        });
      });

      current.shape.forEach((row, dy) => {
        row.forEach((value, dx) => {
          if (value && current.y + dy >= 0) {
            drawCell(
              ctx,
              current.x + dx,
              current.y + dy,
              SIZE,
              COLORS[current.type]
            );
          }
        });
      });
    }
  }

  function drawNext() {
    nctx.fillStyle = "#080d1b";
    nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

    if (!nextType) return;

    const shape = SHAPES[nextType];
    const size = 22;
    const width = shape[0].length * size;
    const height = shape.length * size;
    const offsetX = (nextCanvas.width - width) / 2;
    const offsetY = (nextCanvas.height - height) / 2;

    shape.forEach((row, y) => {
      row.forEach((value, x) => {
        if (!value) return;

        nctx.fillStyle = COLORS[nextType];
        nctx.fillRect(
          offsetX + x * size + 1,
          offsetY + y * size + 1,
          size - 2,
          size - 2
        );

        nctx.fillStyle = "#ffffff30";
        nctx.fillRect(
          offsetX + x * size + 3,
          offsetY + y * size + 3,
          size - 6,
          3
        );
      });
    });
  }

  function collides(piece, dx, dy, shape = piece.shape) {
    for (let y = 0; y < shape.length; y++) {
      for (let x = 0; x < shape[y].length; x++) {
        if (!shape[y][x]) continue;

        const nx = piece.x + x + dx;
        const ny = piece.y + y + dy;

        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny >= 0 && board[ny][nx]) return true;
      }
    }
    return false;
  }

  function move(dx, dy) {
    if (!running || paused || gameOver) return false;

    if (!collides(current, dx, dy)) {
      current.x += dx;
      current.y += dy;
      draw();
      return true;
    }

    if (dy > 0) lockPiece();
    return false;
  }

  function rotate() {
    if (!running || paused || gameOver) return;

    const rotated = current.shape[0].map((_, i) =>
      current.shape.map(row => row[i]).reverse()
    );

    for (const offset of [0, -1, 1, -2, 2]) {
      if (!collides(current, offset, 0, rotated)) {
        current.x += offset;
        current.shape = rotated;
        draw();
        return;
      }
    }
  }

  function lockPiece() {
    current.shape.forEach((row, y) => {
      row.forEach((value, x) => {
        if (!value) return;

        const by = current.y + y;
        const bx = current.x + x;

        if (by < 0) {
          endGame();
          return;
        }

        board[by][bx] = COLORS[current.type];
      });
    });

    if (gameOver) return;

    clearLines();
    spawnPiece();
    draw();
  }

  function clearLines() {
    let cleared = 0;

    for (let y = ROWS - 1; y >= 0; y--) {
      if (board[y].every(cell => cell !== null)) {
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }

    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800];
      score += points[cleared] * level;
      lines += cleared;
      level = Math.floor(lines / 10) + 1;
      updateStats();
    }
  }

  function spawnPiece() {
    current = createPiece(nextType);
    nextType = randomType();
    drawNext();

    if (collides(current, 0, 0)) endGame();
  }

  function hardDrop() {
    if (!running || paused || gameOver) return;

    let distance = 0;
    while (!collides(current, 0, 1)) {
      current.y++;
      distance++;
    }

    score += distance * 2;
    updateStats();
    lockPiece();
    draw();
  }

  function endGame() {
    running = false;
    gameOver = true;

    // 게임 오버 시 배경음악 일시정지 및 초기화
    bgm.pause();
    bgm.currentTime = 0;

    if (score > best) {
      best = score;
      try {
        localStorage.setItem("myTetrisBest", String(best));
      } catch (_) {}
    }

    $("overlayTitle").textContent = "GAME OVER";
    $("overlayText").textContent =
      `최종 점수: ${score.toLocaleString("ko-KR")}점 · 최고 점수: ${best.toLocaleString("ko-KR")}점`;

    $("startBtn").textContent = "다시 도전하기";
    $("overlay").classList.remove("hidden");
    $("pauseBtn").textContent = "Ⅱ 일시 정지";
  }

  function togglePause() {
    if (gameOver) return;

    if (!running) {
      resetGame();
      return;
    }

    paused = !paused;

    if (paused) {
      bgm.pause(); // 일시정지 시 음악 멈춤
    } else {
      bgm.play().catch(() => {}); // 계속하기 시 음악 재개
    }

    $("pauseBtn").textContent =
      paused ? "▶ 계속하기" : "Ⅱ 일시 정지";

    $("overlayTitle").textContent = "PAUSED";
    $("overlayText").textContent = "잠시 쉬어 가세요!";
    $("startBtn").textContent = "계속하기";

    $("overlay").classList.toggle("hidden", !paused);
    draw();
  }

  function handleAction(action) {
    if (action === "left") move(-1, 0);
    if (action === "right") move(1, 0);
    if (action === "down") move(0, 1);
    if (action === "rotate") rotate();
    if (action === "drop") hardDrop();
  }

  document.addEventListener("keydown", event => {
    const keys = [
      "ArrowLeft", "ArrowRight", "ArrowDown",
      "ArrowUp", "Space"
    ];

    if (keys.includes(event.code)) event.preventDefault();

    if (event.code === "KeyP" || event.code === "Escape") {
      togglePause();
      return;
    }

    if (!running || paused || gameOver) return;

    if (event.code === "ArrowLeft") move(-1, 0);
    if (event.code === "ArrowRight") move(1, 0);
    if (event.code === "ArrowDown") {
      if (move(0, 1)) {
        score++;
        updateStats();
      }
    }
    if (event.code === "ArrowUp" || event.code === "KeyX") rotate();
    if (event.code === "Space") hardDrop();
  });

  document.querySelectorAll("[data-action]").forEach(button => {
    button.addEventListener("click", () => {
      handleAction(button.dataset.action);
    });
  });

  $("startBtn").addEventListener("click", () => {
    if (paused && !gameOver) {
      togglePause();
      return;
    }

    resetGame();
    $("overlayTitle").textContent = "READY?";
    $("overlayText").textContent =
      "블록을 쌓고 줄을 완성하세요.";
  });

  $("restartBtn").addEventListener("click", () => {
    resetGame();
  });

  $("pauseBtn").addEventListener("click", togglePause);

  function update(time = 0) {
    const delta = lastTime ? Math.min(time - lastTime, 100) : 0;
    lastTime = time;

    if (running && !paused && !gameOver) {
      dropCounter += delta;
      const interval = Math.max(90, 800 - (level - 1) * 65);

      if (dropCounter >= interval) {
        move(0, 1);
        dropCounter = 0;
      }
    }

    requestAnimationFrame(update);
  }

  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  current = createPiece(randomType());
  nextType = randomType();

  draw();
  drawNext();
  
  // 시작 시 오버레이 화면이 확실하게 보이도록 설정
  $("overlay").classList.remove("hidden");
  
  update();
})();
</script>
</body>
</html>
